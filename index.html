if(type==`bar`)pt.forEach((q,i)=>o+=`<rect x="${q[0]-bw*.3}" y="${q[1]}" width="${bw*.6}" height="${Hh-8-q[1]}" rx="6" fill="${col}"><title>${l[i]}: ${v[i]}</title></rect>`);else{const s=pt.map(q=>q.join(',')).join(' ');o+=`<polygon points="${s} ${pt.at(-1)[0]},${Hh-8} ${pt[0][0]},${Hh-8}" fill="${col}" opacity=".12"/><polyline points="${s}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#fff" stroke="${col}" stroke-width="3"><title>${l[i]}: ${v[i]}</title></circle>`).join('')}

function bot(t){t=t.toLowerCase();if(/blood|black stool|faint|confus|can.?t (drink|keep)|unable to drink|darah|pingsan|bingung|tidak bisa minum/.test(t))return T(`<b>This could be serious.</b> Please get medical help now or call your local emergency number. Don’t wait for it to pass.`,`<b>Ini bisa serius.</b> Segera cari bantuan medis atau hubungi nomor darurat setempat. Jangan menunggu sampai membaik sendiri.`);
if(/prevent|cegah/.test(t))return T(`Simple steps: wash your hands before eating, choose hot and freshly cooked food, drink sealed or treated water, skip ice of unknown origin, and go easy on raw or pre-cut food.`,`Langkah sederhana: cuci tangan sebelum makan, pilih makanan panas yang baru dimasak, minum air kemasan atau air yang sudah diolah, hindari es batu tak jelas asalnya, dan kurangi makanan mentah atau buah potong.`);
if(/street|stall|jajan|kaki lima/.test(t))return T(`Street food can be fine. Pick busy stalls, food cooked in front of you and served hot. Skip food that sits uncovered or lukewarm.`,`Jajanan kaki lima bisa aman. Pilih warung yang ramai, makanan yang dimasak di depanmu dan disajikan panas. Hindari makanan yang dibiarkan terbuka atau suam-suam kuku.`);
if(/dehydrat|dehidrasi|kurang cairan/.test(t))return T(`Signs: dark urine, very dry mouth, dizziness, fast heartbeat, or peeing very little. Sip rehydration drink (ORS) often. If you can’t keep fluids down, see a doctor.`,`Tandanya: urine pekat, mulut sangat kering, pusing, jantung berdebar, atau jarang buang air kecil. Minum oralit sedikit-sedikit tapi sering. Jika cairan tidak bisa masuk, segera ke dokter.`);
if(/diarrh|diare|mencret|loose|stomach|nausea|vomit|mual|muntah|perut/.test(t))return T(`What can help: rest, sip rehydration drink (ORS) often, and eat light food. Avoid alcohol. Don’t take antibiotics on your own. See a doctor if you have fever, blood, strong pain, or it lasts more than 2 days.`,`Yang bisa membantu: istirahat, minum oralit sedikit-sedikit tapi sering, dan makan makanan ringan. Hindari alkohol. Jangan minum antibiotik sendiri. Temui dokter jika demam, ada darah, nyeri hebat, atau berlangsung lebih dari 2 hari.`);
return T(`I can help with prevention, safe food and water, and what to do when your stomach feels bad. Try one of the suggested questions. I’m not a replacement for a doctor.`,`Aku bisa bantu soal pencegahan, makanan dan air yang aman, dan apa yang dilakukan saat perut tidak enak. Coba salah satu pertanyaan yang disarankan. Aku bukan pengganti dokter.`)}

risk(){const s=R.step,top=`<h1>${T(`Check My Risk`,`Cek Risiko Saya`)}</h1><p class="sub">${T(`4 short steps, about 2 minutes.`,`4 langkah singkat, sekitar 2 menit.`)}</p>`,wn=`<div class="wn">${I(`info`)}<span>${T(`This is a simple example check, not a medical test. The score only helps you prepare. It is not a diagnosis or the chance that you will get sick.`,`Ini cek sederhana versi contoh, bukan tes medis. Skor hanya membantumu bersiap, bukan diagnosis atau peluang kamu akan sakit.`)}</span></div>`;

const al=(AL.find(a=>a.c==A.dest)||{t:[``,``]}).t,body=[``,F(T(`City you’re visiting`,`Kota tujuan`),`<select onchange="A.dest=this.value;render()">${Object.keys(CT).map(c=>`<option ${A.dest==c?`selected`:``}>${c}</option>`).join(``)}</select>`)+F(T(`Country`,`Negara`),`<input value="${CT[A.dest].c}" disabled>`)+F(T(`Leaving on`,`Tanggal berangkat`),inp(`dep`,`date`))+F(T(`Coming back`,`Tanggal pulang`),inp(`ret`,`date`))+F(T(`What will you do?`,`Rencana kegiatan`),chips(`act`,[`Beach`,`Hiking`,`Street food tour`,`City sightseeing`,`Diving`])),

`<p class="mu" style="margin-bottom:12px">${T(`Sample data for ${A.dest}. Not live or verified.`,`Data contoh untuk ${A.dest}. Bukan data langsung atau terverifikasi.`)}</p>${[[T(`Food cleanliness`,`Kebersihan makanan`),CT[A.dest].f],[T(`Safe drinking water`,`Keamanan air minum`),CT[A.dest].w],[T(`Local cleanliness`,`Kebersihan lingkungan`),CT[A.dest].s]].map(x=>`<div style="margin-bottom:12px"><div class="row sp"><span>${x[0]}</span><b>${x[1]}/100</b></div>${bar(x[1])}</div>`).join(``)}<div class="wn">${I(`bell-ring`)}<span>${B(al)} (${T(`sample alert`,`contoh peringatan`)})</span></div><p class="mu" style="margin-top:10px">${B(CT[A.dest].n)}</p>`][s];

symptoms(){return `<h1>${T(`Check My Symptoms`,`Cek Gejala Saya`)}</h1><p class="sub">${T(`Simple advice if your stomach feels off while traveling.`,`Saran sederhana jika perutmu tidak enak saat bepergian.`)}</p><div class="wn" style="margin-bottom:16px">${I(`alert-triangle`)}<span>${T(`This is general information, not medical advice or a diagnosis. In an emergency, call your local emergency number.`,`Ini informasi umum, bukan saran medis atau diagnosis. Dalam keadaan darurat, hubungi nomor darurat setempat.`)}</span></div><div class="g g2"><div class="c"><h3>${T(`What do you feel?`,`Apa yang kamu rasakan?`)}</h3><div class="cps" style="margin-bottom:16px">${SYL.map(x=>`<button class="cp ${SY.includes(x)?`on`:``}" onclick="tgS('${x}')">${tv(x)}</button>`).join(``)}</div>${F(T(`When did it start?`,`Kapan mulainya?`),sel(`FU`,`start`,[`Today`,`Yesterday`,`3+ days ago`]))}${F(T(`How often does it happen?`,`Seberapa sering?`),sel(`FU`,`freq`,[`1–2 times`,`3–5 times`,`6+ times`]))}${F(T(`Can you drink fluids?`,`Apakah kamu bisa minum?`),sel(`FU`,`fluids`,[`Yes`,`No`]))}${F(T(`Is it getting worse?`,`Apakah makin parah?`),sel(`FU`,`worse`,[`No`,`Yes`]))}<button class="b" style="width:100%" onclick="analyze()">${T(`Check now`,`Cek sekarang`)}</button></div><div class="c"><h3>${T(`Chat with GUTRAVEL`,`Ngobrol dengan GUTRAVEL`)}</h3><div class="chat" id="scc"></div><div class="row" style="margin-top:10px"><input id="si" placeholder="${T(`Tell me how you feel…`,`Ceritakan yang kamu rasakan…`)}" onkeydown="if(event.key=='Enter')sendS()"><button class="b" onclick="sendS()">${I(`send`)}</button></div></div></div>`},
alerts(){const f=LC.af||`All`;return `<h1>${T(`Health Alerts`,`Peringatan Kesehatan`)}</h1><p class="sub">${T(`Simple reminders for each place you may visit.`,`Pengingat sederhana untuk tiap tempat yang mungkin kamu kunjungi.`)}</p><div class="wn" style="margin-bottom:14px">${I(`flask-conical`)}<span>${T(`<b>SAMPLE DATA.</b> These are made-up examples, not real or live health news.`,`<b>DATA CONTOH.</b> Ini hanya contoh rekaan, bukan kabar kesehatan nyata atau terkini.`)}</span></div><div class="cps" style="margin-bottom:14px">${[`All`,...Object.keys(CT)].map(c=>`<button class="cp ${f==c?`on`:``}" onclick="LC.af='${c}';render()">${tv(c)}</button>`).join(``)}</div><div class="g g2">${AL.filter(a=>f==`All`||a.c==f).map(a=>`<div class="c"><div class="row sp"><span class="tag" style="background:${SC[a.sv]};color:#1c1b3a">${tv(a.sv)}</span><span class="tag" style="background:var(--pl);color:var(--p)">${T(`SAMPLE`,`CONTOH`)}</span></div><h3 style="margin:10px 0 4px">${B(a.t)}</h3><p class="mu">${I(`map-pin`)} ${a.c} · ${T(`updated`,`diperbarui`)} ${fmt(a.d,1)}<br>${T(`Source: GUTRAVEL sample data`,`Sumber: data contoh GUTRAVEL`)}</p><details><summary>${T(`What to do`,`Yang perlu dilakukan`)}</summary><p>• ${a.p.map(B).join(`<br>• `)}</p></details></div>`).join(``)}</div>`},
food(){const ck=CKL.filter((x,i)=>D.CK[i]).length,e=CT[D.P.dest]||CT.Bali,S=[T(`Safer`,`Lebih aman`),T(`Be careful`,`Hati-hati`),T(`Avoid`,`Hindari`)];return `<h1>${T(`Safe Food & Water`,`Makanan & Air Aman`)}</h1><p class="sub">${T(`Simple habits that prevent most travel tummy trouble.`,`Kebiasaan sederhana yang mencegah sakit perut saat bepergian.`)}</p><div class="g g2"><div class="c"><h3>${T(`Which foods are safer?`,`Makanan mana yang lebih aman?`)}</h3><div class="fd">${[[`🍲`,T(`Hot, fresh dishes`,`Hidangan panas, baru dimasak`),`#DFF5E8`,0],[`🥥`,T(`Sealed coconut`,`Kelapa utuh`),`#DFF5E8`,0],[`🥗`,T(`Raw salad`,`Salad mentah`),`#FFF1CF`,1],[`🍉`,T(`Pre-cut fruit`,`Buah yang sudah dipotong`),`#FFF1CF`,1],[`🧊`,T(`Ice of unknown origin`,`Es batu tak jelas asalnya`),`#FDE3E5`,2],[`🍤`,T(`Lukewarm seafood`,`Seafood suam-suam kuku`),`#FDE3E5`,2]].map(x=>`<div style="background:${x[2]};color:#1c1b3a"><b>${x[0]}</b>${x[1]}<br><small>${S[x[3]]}</small></div>`).join(``)}</div></div><div class="c"><h3>${T(`My checklist`,`Daftar cek saya`)} <span class="mu" style="font-weight:500">${ck}/${CKL.length}</span></h3>${bar(ck/CKL.length*100)}<div style="margin-top:8px">${CKL.map((x,i)=>cki(x,i)).join(``)}</div></div></div><div class="c"><h3>${T(`Easy safety guide`,`Panduan keamanan`)}</h3><details><summary>${T(`Food`,`Makanan`)}</summary><p>${T(`Eat freshly cooked food. Skip food that was stored badly. Look at how clean the stall is. Wash your hands before eating.`,`Makan makanan yang baru dimasak. Hindari makanan yang disimpan sembarangan. Lihat kebersihan warungnya. Cuci tangan sebelum makan.`)}</p></details><details><summary>${T(`Water`,`Air`)}</summary><p>${T(`Choose drinking water that is treated or sealed. Avoid ice from unknown sources. Keep your water in a clean, closed bottle.`,`Pilih air minum yang sudah diolah atau tersegel. Hindari es batu dari sumber tak jelas. Simpan air di botol bersih yang tertutup.`)}</p></details><details><summary>${T(`Personal hygiene`,`Kebersih const bn=[['dash',T(`Home`,`Beranda`),'layout-dashboard'],['risk',T(`Risk`,`Risiko`),'clipboard-check'],['symptoms',T(`Symptoms`,`Gejala`),'stethoscope'],['alerts',T(`Alerts`,`Peringatan`),'bell-ring'],['more',T(`More`,`Lainnya`),'menu']];$('#bn').innerHTML=bn.map(n=>`<button class="${n[0]==k?`on`:``}" onclick="${n[0]==`more`?`moreM()`:`go('${n[0]}')`}">${I(n[2])}${n[1]}</button>`).join(``);
$('#ic').innerHTML=`<div class="lang"><button class="${lg()==`id`?`on`:``}" onclick="setLg('id')">ID</button><button class="${lg()==`en`?`on`:``}" onclick="setLg('en')">EN</button></div><button class="ib" onclick="toast(T('No new alerts. This is sample data.','Belum ada peringatan baru. Ini data contoh.'))" aria-label="${T(`Notifications`,`Notifikasi`)}">${I(`bell`)}<em></em></button><div class="av" id="av" onclick="go('prefs')">${D.P.name[0].toUpperCase()}</div>`;
const h=D.H[0];$('#rp').innerHTML=`<div class="c"><h3>${T(`Health summary`,`Ringkasan kesehatan`)}</h3>${h?`<div class="row" style="justify-content:center">${ring(h.s,130)}</div><p style="text-align:center;margin-top:8px"><b>${rl(cat(h.s))}</b><br><span class="mu">${h.t} · ${fmt(h.d)}</span></p>`:``}<div class="li">${I(`plane`)}<span>${D.P.dest} · ${T(`5 days`,`5 hari`)}</span></div><div class="li">${I(`list-checks`)}<span>${CKL.filter((x,i)=>D.CK[i]).length}/${CKL.length} ${T(`done`,`selesai`)}</span></div><button class="b" style="width:100%;margin-top:10px" onclick="go('locator')">${T(`Find a clinic`,`Cari klinik`)}</button></div>`;
fix();anim();draw('scc',SCH);document.documentElement.lang=lg();scrollTo(0,first?0:y)}
function moreM(){modal(`<h3 style="margin-bottom:8px">${T(`More`,`Lainnya`)}</h3>`+N.slice(4).map(n=>`<button class="nv" style="width:100%" onclick="closeM();go('${n[0]}')">${I(n[3])}${nl(n)}</button>`).join(``))}
addEventListener('hashchange',()=>render(1));render(1);apr();
</script></body></html>
